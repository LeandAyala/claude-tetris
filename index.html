<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <div id="name-entry" class="hidden">
            <p class="rec-hint">¡Nuevo récord! Escribe tu nombre</p>
            <div class="rec-row">
              <input id="name-input" type="text" maxlength="12" autocomplete="off" placeholder="Nombre" />
              <button id="save-name-btn" class="rec-btn">Guardar</button>
            </div>
          </div>
          <ol id="overlay-records" class="rec-list"></ol>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>

      <div id="start-screen" class="overlay">
        <div class="overlay-box">
          <p class="rec-title">TOP 5</p>
          <ol id="start-records" class="rec-list"></ol>
          <p class="rec-stat">Mejor combo: <span id="best-combo">0</span></p>
          <p class="rec-stat">Líneas máximas: <span id="max-lines">0</span></p>
          <button id="play-btn">Jugar</button>
          <div id="clear-area">
            <button id="clear-records-btn" class="rec-btn">Borrar récords</button>
            <div id="clear-confirm" class="hidden">
              <span class="rec-hint">¿Borrar todos los récords?</span>
              <button id="clear-yes-btn" class="rec-btn">Sí, borrar</button>
              <button id="clear-no-btn" class="rec-btn">Cancelar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
